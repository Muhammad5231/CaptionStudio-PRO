# ==============================================================================
# CaptionStudio PRO — Local Background Queue Broker (Redis)
#
# SQLite is used directly for database storage (data/captionstudio.db).
# Local filesystem is used for object storage (./uploads).
# This docker-compose service is strictly for running local Redis for BullMQ background workers.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Redis Queue Broker for BullMQ
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: captionstudio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
